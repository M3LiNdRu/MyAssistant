openapi: 3.0.0
info:
  description: ""
  version: "0.3.0"
  title: "Expenses API"
paths:
  /api/v1/expenses:
    get:
      tags:
        - Expenses
      summary: "Get all expenses"
      operationId: "GetAllExpenses"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensesResponse'
  /api/v1/expenses/monthly:
    get:
      tags:
        - Expenses
      summary: "Get current month expenses"
      operationId: "GetMonthlyExpenses"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensesResponse'
  /api/v1/expenses/monthly/{year}/{month}:
    get:
      tags:
        - Expenses
      summary: "Get expenses for a specific month"
      operationId: "GetMonthlyExpensesByYearAndMonth"
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
            example: 2025
        - name: month
          in: path
          required: true
          schema:
            type: integer
            example: 7
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensesResponse'
  /api/v1/expense:
    post:
      tags:
        - Expenses
      summary: "Add a new expense"
      operationId: "AddExpense"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Expense'
      responses:
        '200':
          description: Successful operation
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /api/v1/expense/{id}:
    delete:
      tags:
        - Expenses
      summary: "Delete an expense"
      operationId: "DelExpense"
      parameters:
        - name: id
          in: path
          required: true
          description: Expense Id
          schema:
            type: string
            example: "64f1a2b3c4d5e6f7a8b9c0d1"
      responses:
        '200':
          description: Successful operation
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /api/v1/categories:
    get:
      tags:
        - Categories
      summary: "Get all categories"
      operationId: "GetAllCategories"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
  /api/v1/category:
    post:
      tags:
        - Categories
      summary: "Add a new category"
      operationId: "AddCategory"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
  /api/v1/category/{name}:
    delete:
      tags:
        - Categories
      summary: "Remove a category"
      operationId: "RemoveCategory"
      parameters:
        - name: name
          in: path
          required: true
          description: Category name
          schema:
            type: string
            example: Carburant
      responses:
        '200':
          description: Successful operation
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /api/v1/tags:
    get:
      tags:
        - Tags
      summary: "Get all tags"
      operationId: "GetAllTags"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
  /api/v1/summary/current:
    get:
      tags:
        - Summary
      summary: "Get current month summary"
      operationId: "GetCurrentSummary"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSummary'
  /api/v1/summary/monthly/{year}/{month}:
    get:
      tags:
        - Summary
      summary: "Get complete summary for a specific month"
      operationId: "GetMonthlySummary"
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
            example: 2025
        - name: month
          in: path
          required: true
          schema:
            type: integer
            example: 7
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteSummary'
  /api/v1/summary/category-breakdown:
    get:
      tags:
        - Summary
      summary: "Get monthly expense breakdown by category for the last 12 months"
      operationId: "GetCategoryBreakdown"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryBreakdown'
  /api/v1/historigram/savings:
    get:
      tags:
        - Historigrams
      summary: "Get savings historigram for the last 12 months"
      operationId: "GetSavingsHistorigram"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsHistorigram'
components:
  schemas:
    Expense:
      type: object
      required:
        - category
        - amount
      properties:
        timestamp:
          type: string
          format: date-time
        category:
          type: string
          example: Carburant
        name:
          type: string
          example: EL BRUCH
        amount:
          type: number
          format: float
          example: -56.90
        currency:
          type: string
          example: EUR
        tags:
          type: array
          items:
            type: string
    ExpensesResponse:
      type: object
      required:
        - expenses
      properties:
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
    Category:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          example: Carburant
        description:
          type: string
          example: Despeses de carburant
    CategoriesResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    TagsResponse:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          items:
            type: string
    CurrentSummary:
      type: object
      properties:
        month:
          type: string
          example: July
        year:
          type: string
          example: "2025"
        totalAmount:
          type: number
          format: float
          example: -450.00
        progressBar:
          type: object
          additionalProperties:
            type: integer
          description: Category name to percentage of total spending
    CompleteSummary:
      type: object
      properties:
        month:
          type: string
          example: July
        year:
          type: string
          example: "2025"
        start:
          type: number
          format: float
          description: Total income (positive amounts)
          example: 2000.00
        saved:
          type: number
          format: float
          description: Net amount (income minus expenses)
          example: 500.00
        spentByCategory:
          type: object
          additionalProperties:
            type: number
            format: float
          description: Category name to absolute amount spent
        progressBar:
          type: object
          additionalProperties:
            type: integer
          description: Category name to percentage of total spending
    CategoryBreakdown:
      type: object
      properties:
        months:
          type: array
          items:
            type: string
          description: Ordered list of month labels in yyyy-MM format
          example: ["2024-08", "2024-09"]
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRow'
        totalAverage:
          type: number
          format: float
          description: Sum of all per-category averages
          example: 1234.56
    CategoryRow:
      type: object
      properties:
        category:
          type: string
          example: Carburant
        monthlyAmounts:
          type: array
          items:
            type: number
            format: float
          description: Absolute amount spent per month, aligned with the months array
        average:
          type: number
          format: float
          description: Average monthly spend across months with non-zero data
          example: 65.30
    SavingsHistorigram:
      type: object
      properties:
        totalSavings:
          type: number
          format: float
          example: 5000.00
        totalEarned:
          type: number
          format: float
          example: 24000.00
        totalSpent:
          type: number
          format: float
          example: 19000.00
        progressLine:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HistorigramDot'
          description: DateTime key to monthly aggregated savings/spent/earned
    HistorigramDot:
      type: object
      properties:
        saved:
          type: number
          format: float
        spent:
          type: number
          format: float
        earned:
          type: number
          format: float
  securitySchemes:
    oAuth:
      type: oauth2
      description: This API uses OAuth 2 with the implicit grant flow.
      flows:
        authorizationCode:
          authorizationUrl: https://api.example.com/oauth2/authorize
          tokenUrl: https://api.example.com/oauth2/token
          scopes:
            read_expenses: read your expenses
            write_expenses: write your expenses
