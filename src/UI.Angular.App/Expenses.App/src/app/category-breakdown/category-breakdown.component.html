<div class="table-container">
  <table mat-table [dataSource]="breakdown.categories" class="mat-elevation-z8">

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Category</th>
      <td mat-cell *matCellDef="let row">{{ row.category }}</td>
      <td mat-footer-cell *matFooterCellDef><strong>Total</strong></td>
    </ng-container>

    @for (month of breakdown.months; track month) {
      <ng-container [matColumnDef]="month">
        <th mat-header-cell *matHeaderCellDef [class.current-month]="month === currentMonth">{{ month }}</th>
        <td mat-cell *matCellDef="let row" [class.current-month]="month === currentMonth">
          {{ getMonthAmount(row, month) | number: '1.2-2' }}
        </td>
        <td mat-footer-cell *matFooterCellDef [class.current-month]="month === currentMonth">
          <strong>{{ getMonthTotal(month) | number: '1.2-2' }} €</strong>
        </td>
      </ng-container>
    }

    <ng-container matColumnDef="average">
      <th mat-header-cell *matHeaderCellDef><strong>Average</strong></th>
      <td mat-cell *matCellDef="let row"><strong>{{ row.average | number: '1.2-2' }} €</strong></td>
      <td mat-footer-cell *matFooterCellDef><strong>{{ breakdown.totalAverage | number: '1.2-2' }} €</strong></td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
  </table>
</div>
